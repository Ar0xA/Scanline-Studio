name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Piece Audio 1b: cl.exe is not on PATH by default on GitHub's windows-latest runners
      # outside a Developer Command Prompt -- Yoniq.Core.Audio.MiniAudio's BuildNativeShimWindows
      # MSBuild target needs it. No equivalent step is needed for macOS (clang/Xcode command line
      # tools are already on PATH on macos-latest) or Linux (gcc likewise).
      - name: Set up MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore
        run: dotnet restore Yoniq.sln

      - name: Build (warnings as errors)
        run: dotnet build Yoniq.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Yoniq.sln --no-build --configuration Release --logger "console;verbosity=normal"
